<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>King Khalid Racecourse — Scene Prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
  #scene { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 14px; left: 14px; display: flex; gap: 8px;
    font-family: system-ui, sans-serif; z-index: 10;
  }
  #hud button {
    padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
    background: rgba(20,26,32,.55); color: #eef2f5; font-size: 13px; cursor: pointer;
    backdrop-filter: blur(4px);
  }
  #hud button.active { background: #c9772e; border-color: #c9772e; color: #fff; }
  #title {
    position: fixed; bottom: 14px; left: 14px; color: rgba(255,255,255,.75);
    font: 12px system-ui, sans-serif; z-index: 10;
  }
  #refPanel {
    position: fixed; top: 60px; left: 14px; z-index: 20; display: none;
    flex-direction: column; gap: 6px; width: 240px; padding: 12px;
    background: rgba(16,22,28,.82); border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px; color: #e8eef3; font: 12px system-ui, sans-serif;
    backdrop-filter: blur(5px);
  }
  #refPanel label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #refPanel input[type="range"] { width: 140px; }
  #refPanel .refBtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  #refPanel button {
    padding: 4px 8px; font-size: 11px; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,.12); color: #eef2f5; border: 1px solid rgba(255,255,255,.3);
  }
  #refPanel small { opacity: .7 }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <button data-camera="referenceMatch" class="active">1 · RefMatch</button>
  <button data-camera="topOrthographic">2 · TopOrtho</button>
  <button data-camera="aerialHero">3 · AerialHero</button>
  <button data-camera="trackside">4 · Trackside</button>
  <button data-camera="grandstand">5 · Grandstand</button>
  <button data-camera="integrationOverview">6 · Overview</button>
  <button id="refBtn" title="REFERENCE ALIGNMENT MODE (R)">REF</button>
  <button id="variantBtn"></button>
</div>
<div id="title">King Khalid Racecourse — standalone scene prototype (no gameplay wiring)</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
